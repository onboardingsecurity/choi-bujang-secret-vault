<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101a28">
  <title>BYTE BACK 내 자료실</title>
  <!-- 11단계: 설치형 웹앱 설정. 설치는 화면을 앱 창으로 여는 것일 뿐 기기 확인이 아닙니다. -->
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; background: #101a28; color: #ecf4ff; }
    main { max-width: 760px; margin: 0 auto; padding: 44px 22px 64px; }
    .eyebrow { color: #8ad8df; font-size: 14px; font-weight: 700; letter-spacing: .08em; }
    h1 { margin: 16px 0; font-size: clamp(30px, 7vw, 48px); line-height: 1.2; }
    p { font-size: 17px; line-height: 1.7; color: #bfd0e5; }
    .notice { margin: 26px 0; padding: 18px; border: 1px solid #d07384; border-radius: 14px; color: #ffe3e8; background: #612a3544; }
    ul { list-style: none; display: grid; gap: 12px; padding: 0; }
    li { border: 1px solid #51667c; border-radius: 14px; padding: 17px 19px; background: #1a2a3d; }
    strong { display: block; font-size: 18px; margin-bottom: 5px; }
    li span { color: #bfd0e5; display: block; white-space: pre-wrap; }
    form { display: grid; gap: 10px; margin: 18px 0; }
    input, textarea { font: inherit; padding: 10px 12px; border-radius: 10px; border: 1px solid #51667c; background: #0c1521; color: #ecf4ff; }
    button { font: inherit; font-weight: 700; padding: 9px 16px; border-radius: 10px; border: 0; background: #8ad8df; color: #0c1521; cursor: pointer; }
    button.sub { background: #2c4058; color: #ecf4ff; }
    .row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
    .msg { min-height: 1.5em; color: #ffb3c0; }
    .bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
    .status { margin: 22px 0; padding: 14px 18px; border: 1px solid #51667c; border-radius: 14px; background: #1a2a3d; }
    .status div { display: flex; gap: 10px; flex-wrap: wrap; line-height: 1.8; }
    .status .label { color: #8ad8df; font-weight: 700; min-width: 5.5em; }
    .status p { margin: 8px 0 0; font-size: 15px; }
    .offline { margin: 18px 0; padding: 14px 18px; border: 1px solid #e0b25c; border-radius: 14px; color: #fff1d6; background: #5c451a55; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">BYTE BACK · 11단계 나만의 접속 앱</div>
    <h1>내 자료실</h1>
    <p>아래 기록은 모두 실습을 위해 만든 가상 자료입니다. 가상 이메일과 가상 메모만 쓰세요.</p>

    <section class="status" aria-label="접속 상태">
      <div><span class="label">앱</span><span id="install-state">브라우저 탭에서 열림</span></div>
      <div><span class="label">기기 승인</span><span id="device-state">서버 확인 전</span></div>
      <p>앱을 설치해도 기기 확인은 끝나지 않습니다. 이 기기의 승인 여부는 서버만 정합니다.</p>
    </section>
    <div class="offline" id="offline" role="status" hidden>오프라인입니다. 서버가 로그인과 기기를 확인할 수 없어 자료를 새로 불러오지 않습니다.</div>

    <section id="login-box" hidden>
      <div class="notice">로그인해야 메모를 볼 수 있습니다.</div>
      <form id="login-form">
        <input id="email" type="email" autocomplete="username" placeholder="이메일" required>
        <input id="password" type="password" autocomplete="current-password" placeholder="비밀번호" required>
        <button type="submit">로그인</button>
      </form>
    </section>

    <section id="app-box" hidden>
      <div class="bar"><span id="who"></span><button id="logout" class="sub" type="button">로그아웃</button></div>
      <form id="note-form">
        <input id="note-title" maxlength="200" placeholder="제목" required>
        <textarea id="note-body" maxlength="5000" rows="3" placeholder="가상 메모 내용" required></textarea>
        <button type="submit" id="note-submit">메모 추가</button>
      </form>
      <ul id="notes" aria-live="polite"></ul>
    </section>
    <p class="msg" id="msg" role="status"></p>
  </main>
  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/+esm';
    const $ = id => document.getElementById(id);
    const say = text => { $('msg').textContent = text; };

    // 11단계: 설치 상태는 화면 표시용입니다. 앱 창으로 열렸다는 사실은 기기 승인 근거로 쓰지 않습니다.
    const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
    $('install-state').textContent = standalone ? '설치한 앱 창에서 열림 (기기 확인과는 별개)' : '브라우저 탭에서 열림';
    const showOnline = () => { $('offline').hidden = navigator.onLine; };
    addEventListener('online', showOnline);
    addEventListener('offline', showOnline);
    showOnline();
    // 서비스 워커는 오프라인 안내 페이지만 저장하고 자료·토큰·/api/ 응답은 저장하지 않습니다(public/sw.js).
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});

    // 로그인에 쓰는 공개용 값은 소스에 적지 않고 서버 함수(/api/config)에서 받습니다.
    const settings = await fetch('/api/config', { cache: 'no-store' })
      .then(r => (r.ok ? r.json() : null)).catch(() => null);
    if (!settings?.url || !settings?.key) say('로그인 설정을 불러오지 못했습니다.');
    const supabase = createClient(settings?.url ?? 'https://invalid.invalid', settings?.key ?? 'unset');
    let editingId = null;
    let accessToken = null;

    async function api(path, options = {}) {
      const response = await fetch(path, {
        ...options, cache: 'no-store',
        headers: { 'content-type': 'application/json', authorization: `Bearer ${accessToken}` },
      });
      if (response.status === 401) { await supabase.auth.signOut(); throw new Error('로그인이 만료되었거나 거부되었습니다.'); }
      if (!response.ok) throw new Error(`요청이 거부되었습니다 (HTTP ${response.status}).`);
      return response.json();
    }

    function render(notes) {
      $('notes').replaceChildren(...notes.map(note => {
        const item = document.createElement('li');
        const title = document.createElement('strong');
        const body = document.createElement('span');
        title.textContent = note.title;
        body.textContent = note.body;
        const row = document.createElement('div');
        row.className = 'row';
        const edit = document.createElement('button');
        edit.className = 'sub'; edit.type = 'button'; edit.textContent = '수정';
        edit.onclick = () => {
          editingId = note.id;
          $('note-title').value = note.title;
          $('note-body').value = note.body;
          $('note-submit').textContent = '메모 저장';
          $('note-title').focus();
        };
        const del = document.createElement('button');
        del.className = 'sub'; del.type = 'button'; del.textContent = '삭제';
        del.onclick = async () => {
          try { await api(`/api/notes/${note.id}`, { method: 'DELETE' }); say('삭제했습니다.'); await load(); }
          catch (error) { say(error.message); }
        };
        row.append(edit, del);
        item.append(title, body, row);
        return item;
      }));
    }

    async function load() {
      try {
        const notes = await api('/api/notes');
        if (!Array.isArray(notes)) throw new Error('자료 형식이 맞지 않습니다.');
        render(notes);
        if (!notes.length) $('notes').replaceChildren(Object.assign(document.createElement('li'), { textContent: '내 메모가 아직 없습니다.' }));
      } catch (error) { say(error.message); }
    }

    function show(session) {
      accessToken = session?.access_token ?? null;
      $('login-box').hidden = Boolean(session);
      $('app-box').hidden = !session;
      if (session) { $('who').textContent = `로그인: ${session.user.email}`; load(); }
      else { $('notes').replaceChildren(); editingId = null; }
    }

    $('login-form').addEventListener('submit', async event => {
      event.preventDefault();
      say('');
      const { error } = await supabase.auth.signInWithPassword({
        email: $('email').value, password: $('password').value });
      $('password').value = '';
      if (error) say(`로그인 실패: ${error.message}`);
    });
    $('logout').addEventListener('click', async () => {
      await supabase.auth.signOut();
      say('로그아웃했습니다.');
    });
    $('note-form').addEventListener('submit', async event => {
      event.preventDefault();
      const fields = JSON.stringify({ title: $('note-title').value, body: $('note-body').value });
      try {
        if (editingId) await api(`/api/notes/${editingId}`, { method: 'PUT', body: fields });
        else await api('/api/notes', { method: 'POST', body: fields });
        say(editingId ? '수정했습니다.' : '추가했습니다.');
        editingId = null;
        $('note-form').reset();
        $('note-submit').textContent = '메모 추가';
        await load();
      } catch (error) { say(error.message); }
    });

    supabase.auth.onAuthStateChange((_event, session) => show(session));
    show((await supabase.auth.getSession()).data.session);
  </script>
</body>
</html>
