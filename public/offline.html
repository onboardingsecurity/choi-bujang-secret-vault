<!doctype html>
<html lang="ko">
<head>

  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; background: #101a28; color: #ecf4ff; }
    main { max-width: 760px; margin: 0 auto; padding: 44px 22px 64px; }
    .eyebrow { color: #8ad8df; font-size: 14px; font-weight: 700; letter-spacing: .08em; }
    h1 { margin: 16px 0; font-size: clamp(28px, 6vw, 40px); line-height: 1.2; }
    p { font-size: 17px; line-height: 1.7; color: #bfd0e5; }
    .notice { margin: 26px 0; padding: 18px; border: 1px solid #d07384; border-radius: 14px; color: #ffe3e8; background: #612a3544; }
    a { display: inline-block; font-weight: 700; padding: 9px 16px; border-radius: 10px; background: #8ad8df; color: #0c1521; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">BYTE BACK · 내 자료실</div>
    <h1>지금은 오프라인입니다</h1>
    <div class="notice">자료실은 열 때마다 서버가 로그인과 이 기기의 승인을 다시 확인합니다. 오프라인에서는 그 확인을 할 수 없으므로 메모를 보여 주지 않습니다.</div>
    <p>이 앱은 메모, 로그인 토큰, 기기 키를 브라우저 저장소에 두지 않습니다. 앱을 설치했다는 사실만으로는 기기 확인이 끝나지 않습니다.</p>
    <p><a href="/">연결되면 다시 열기</a></p>
  </main>
</body>
</html>
